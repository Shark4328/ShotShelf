name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and release notes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid version tag: $tag" }
          $version = $tag.Substring(1)
          if (-not (Test-Path -LiteralPath "docs/releases/$tag.md")) { throw "Missing release notes: docs/releases/$tag.md" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('VERSION=' + $version) -Encoding ASCII

      - name: Build and package
        shell: powershell
        run: .\build.ps1 -Package

      - name: Verify version and assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo('build\ShotShelf.exe')
          if ($info.ProductVersion -ne $env:VERSION) { throw "Product version $($info.ProductVersion) does not match tag $env:VERSION" }
          $zip = "releases\ShotShelf-$env:VERSION-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Missing package: $zip" }
          if (-not (Test-Path -LiteralPath ($zip + '.sha256'))) { throw "Missing checksum: $zip.sha256" }
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($zip)
          $expected = (Get-Content -LiteralPath ($zip + '.sha256') -Raw).Trim()
          if ($actual -ne $expected) { throw 'Package SHA-256 does not match checksum file' }

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: "ShotShelf 图架"
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $zip = "releases\ShotShelf-$env:VERSION-windows-x64.zip"
          gh release create $tag $zip ($zip + '.sha256') --title ($env:RELEASE_TITLE + ' ' + $env:VERSION) --notes-file "docs/releases/$tag.md" --verify-tag --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create GitHub Release' }
